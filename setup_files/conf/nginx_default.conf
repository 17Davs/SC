server {
    listen 80;
    server_name _;

    # index SC
    location / {
        root /cluster/www;    # default SC WEB page
        index index.html;
    }

    # Cacti Location
    location /cacti {
        alias /cluster/www/cacti;
        index index.php;

        location ~ \.php$ {
            include snippets/fastcgi-php.conf;
            fastcgi_pass unix:/var/run/php/php7.4-fpm.sock; 
            fastcgi_param SCRIPT_FILENAME $request_filename;
            include fastcgi_params;
        }

        location ~ /\.ht {
            deny all;
        }
    }

    # Ganglia location
    location /ganglia {
        alias /cluster/www/ganglia;
        index index.php index.html index.htm;

        location ~ \.php$ {
            include snippets/fastcgi-php.conf;
            fastcgi_pass unix:/var/run/php/php7.4-fpm.sock;  
            fastcgi_param SCRIPT_FILENAME $request_filename;
            include fastcgi_params;
        }

        location ~ /\.ht {
            deny all;
        }
    }

    
    error_log /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}
