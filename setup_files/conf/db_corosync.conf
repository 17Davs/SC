# Please read the corosync.conf.5 manual page
system {
    allow_knet_handle_fallback: yes
}

totem {
    version: 2
    cluster_name: DBCluster
    crypto_cipher: none
    crypto_hash: none
}

logging {
    fileline: off
    to_stderr: yes
    to_logfile: yes
    logfile: /var/log/corosync/corosync.log
    to_syslog: yes
    debug: off
}

quorum {
    provider: corosync_votequorum
    expected_votes: 1
}

nodelist {
    node {
        name: sql1
        nodeid: 1
        ring0_addr: sql1
    }
    node {
        name: sql2
        nodeid: 2
        ring0_addr: sql2
    }
}